<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Youtube — Redesigned</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ── THEME VARIABLES ──────────────────────────────────── */
    :root, [data-theme="light"] {
      --bg-start:    #fde8e1;
      --bg-mid:      #fad4c8;
      --bg-end:      #f8c0ae;
      --orb-warm:    rgba(255, 112,  58, 0.48);
      --orb-cool:    rgba(102,  53,  19, 0.30);
      --orb-mid:     rgba(255, 112,  58, 0.32);
      --orb-extra:   rgba(102,  53,  19, 0.22);
      --orb-extra2:  rgba(255, 112,  58, 0.20);
      --glass-bg:    rgba(253, 228, 218, 0.52);
      --glass-bd:    rgba(255, 170, 130, 0.55);
      --glass-sh:    0 8px 32px rgba(102, 53, 19, 0.12);
      --blur:        14px;
      --text-1:      #3d1f0a;
      --text-2:      #663513;
      --text-3:      #b06545;
      --warm:        #ff703a;
      --cool:        #663513;
      --warm-glow:   rgba(255, 112,  58, 0.24);
      --cool-glow:   rgba(102,  53,  19, 0.18);
      --nav-h:       64px;
      --sidebar-w:   220px;
      --ease:        0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="dark"] {
      --bg-start:    #0c1f18;
      --bg-mid:      #152e24;
      --bg-end:      #1e3c34;
      --orb-warm:    rgba(179, 248, 132, 0.55);
      --orb-cool:    rgba(226, 244,  82, 0.45);
      --orb-mid:     rgba(179, 248, 132, 0.38);
      --orb-extra:   rgba(226, 244,  82, 0.28);
      --orb-extra2:  rgba(179, 248, 132, 0.22);
      --glass-bg:    rgba( 20,  50,  38, 0.55);
      --glass-bd:    rgba(179, 248, 132, 0.18);
      --glass-sh:    0 8px 32px rgba(0, 0, 0, 0.50);
      --blur:        18px;
      --text-1:      #eafad4;
      --text-2:      #b3f884;
      --text-3:      #6aad52;
      --warm:        #e2f452;
      --cool:        #b3f884;
      --warm-glow:   rgba(226, 244,  82, 0.26);
      --cool-glow:   rgba(179, 248, 132, 0.22);
    }

    /* ── RESET ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      color: var(--text-1);
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 55%, var(--bg-end) 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      transition: color var(--ease);
    }
    img { display: block; }
    button { font-family: inherit; }

    /* ── BACKGROUND ORBS ──────────────────────────────────── */
    @keyframes drift1 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%     { transform: translate(50px,-40px) scale(1.08); }
    }
    @keyframes drift2 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%     { transform: translate(-40px,35px) scale(1.06); }
    }
    @keyframes drift3 {
      0%,100% { transform: translate(-50%,-50%) scale(1); }
      50%     { transform: translate(calc(-50% + 35px),calc(-50% - 45px)) scale(1.1); }
    }
    @keyframes drift4 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%     { transform: translate(30px,40px) scale(0.95); }
    }
    @keyframes drift5 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%     { transform: translate(-45px,-30px) scale(1.05); }
    }
    .bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      transition: background 0.8s ease;
    }
    .orb-1 { width: 520px; height: 520px; background: var(--orb-warm);   top: -160px; right: -130px; animation: drift1 12s ease-in-out infinite; }
    .orb-2 { width: 460px; height: 460px; background: var(--orb-cool);   bottom: -140px; left: -110px; animation: drift2 15s ease-in-out infinite; }
    .orb-3 { width: 320px; height: 320px; background: var(--orb-mid);    top: 38%; left: 42%; animation: drift3 10s ease-in-out infinite; }
    .orb-4 { width: 380px; height: 380px; background: var(--orb-extra);  top: 55%; right: -80px; animation: drift4 13s ease-in-out infinite; }
    .orb-5 { width: 260px; height: 260px; background: var(--orb-extra2); top: 10%; left: 20%; animation: drift5 11s ease-in-out infinite; }

    /* ── GLASS BASE ───────────────────────────────────────── */
    .g {
      background: var(--glass-bg);
      border: 1px solid var(--glass-bd);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      box-shadow: var(--glass-sh);
      transition: background var(--ease), border-color var(--ease);
    }

    /* ── NAVBAR ───────────────────────────────────────────── */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--nav-h);
      z-index: 100;
      display: flex; align-items: center; gap: 14px;
      padding: 0 18px;
      border-radius: 0;
      border-top: none; border-left: none; border-right: none;
    }
    .nav-left  { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .nav-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .nav-center { flex: 1; max-width: 520px; margin: 0 auto; }

    /* hamburger */
    .burger {
      width: 40px; height: 40px;
      border: none; background: transparent; cursor: pointer;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
      border-radius: 10px; transition: background 0.2s; padding: 8px;
    }
    .burger:hover { background: var(--glass-bg); }
    .bline {
      width: 22px; height: 2px;
      background: var(--text-1);
      border-radius: 2px;
      transform-origin: center;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .burger.x .bline:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .burger.x .bline:nth-child(2) { opacity: 0; }
    .burger.x .bline:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* logo */
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.2rem; letter-spacing: -0.02em; }
    .logo-icon {
      width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--warm), var(--cool));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #fff;
    }
    .logo-text {
      background: linear-gradient(135deg, var(--warm), var(--cool));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* search */
    .search-bar { display: flex; align-items: center; border-radius: 99px; overflow: hidden; height: 38px; }
    .search-input {
      flex: 1; border: none; background: transparent;
      padding: 0 14px; font-size: 0.875rem; color: var(--text-1); outline: none;
    }
    .search-input::placeholder { color: var(--text-3); }
    .search-btn {
      width: 42px; height: 38px; border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--warm), var(--cool));
      font-size: 15px; display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s;
    }
    .search-btn:hover { opacity: 0.82; }

    /* theme toggle */
    .theme-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid var(--glass-bd);
      background: var(--glass-bg); backdrop-filter: blur(8px);
      cursor: pointer; font-size: 17px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.3s ease, background 0.2s;
    }
    .theme-btn:hover { transform: scale(1.12); }

    /* avatar */
    .u-avatar {
      width: 34px; height: 34px; border-radius: 50%; overflow: hidden;
      border: 2px solid var(--warm); flex-shrink: 0;
    }
    .u-avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* ── SIDEBAR ──────────────────────────────────────────── */
    .sidebar {
      position: fixed; top: var(--nav-h); left: 0; bottom: 0;
      width: var(--sidebar-w); z-index: 90;
      transform: translateX(-100%); transition: transform var(--ease);
      padding: 18px 10px;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-inner {
      border-radius: 16px; padding: 10px;
      height: 100%; display: flex; flex-direction: column; gap: 7px;
    }

    .nav-btn {
      width: 100%; display: flex; align-items: center; gap: 11px;
      padding: 11px 14px;
      border: 1px solid var(--glass-bd); border-radius: 11px;
      background: var(--glass-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      cursor: pointer; color: var(--text-1);
      font-size: 0.875rem; font-weight: 500;
      transition: background 0.2s, transform 0.15s; text-align: left;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.55); transform: translateX(3px); }
    [data-theme="dark"] .nav-btn:hover { background: rgba(255,255,255,0.12); }
    .nav-btn.active {
      background: linear-gradient(135deg, var(--warm-glow), var(--cool-glow));
      border-color: var(--warm);
    }
    .nav-icon { font-size: 1.05rem; }

    .overlay {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(0,0,0,0.22); backdrop-filter: blur(2px);
    }

    /* ── MAIN CONTENT ─────────────────────────────────────── */
    .main {
      position: relative; z-index: 1;
      margin-top: var(--nav-h);
      padding: 22px 18px;
      min-height: calc(100vh - var(--nav-h));
    }

    /* ── HOME GRID ────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px; max-width: 1380px; margin: 0 auto;
    }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3,1fr); } }
    @media (max-width:  760px) { .grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width:  480px) { .grid { grid-template-columns: 1fr; } }

    /* ── THUMBNAIL CARD ───────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0);    }
    }
    .t-card {
      border-radius: 16px; overflow: hidden; cursor: pointer;
      animation: fadeUp 0.45s ease both;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .t-card:hover { transform: translateY(-5px) scale(1.025); box-shadow: 0 22px 50px rgba(0,0,0,0.18); }

    .t-img-wrap { position: relative; aspect-ratio: 16/9; overflow: hidden; }
    .t-img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.4s ease;
    }
    .t-card:hover .t-img { transform: scale(1.06); }

    /* glass glare overlay on thumbnail */
    .t-glare {
      position: absolute; inset: 0; pointer-events: none;
      z-index: 1;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.20) 0%,
        rgba(255,255,255,0.07) 28%,
        transparent 52%,
        rgba(255,255,255,0.04) 100%
      );
    }
    .t-dur {
      position: absolute; bottom: 7px; right: 8px; z-index: 2;
      background: rgba(0,0,0,0.76); color: #fff;
      font-size: 0.7rem; font-weight: 600;
      padding: 2px 6px; border-radius: 4px; letter-spacing: 0.02em;
    }
    .t-info { padding: 11px 12px; display: flex; gap: 9px; align-items: flex-start; }
    .ch-av {
      width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
      border: 1.5px solid var(--glass-bd);
    }
    .t-text { flex: 1; min-width: 0; }
    .t-title {
      font-size: 0.82rem; font-weight: 600; color: var(--text-1); line-height: 1.35;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      margin-bottom: 3px;
    }
    .t-meta { font-size: 0.72rem; color: var(--text-2); display: flex; flex-direction: column; gap: 1px; }
    .ch-name { font-weight: 500; }

    /* ── PLAYER PAGE ──────────────────────────────────────── */
    .player-pg {
      display: grid; grid-template-columns: 1fr 370px; gap: 26px;
      max-width: 1380px; margin: 0 auto;
    }
    @media (max-width: 1000px) { .player-pg { grid-template-columns: 1fr; } }

    .player-col { display: flex; flex-direction: column; gap: 14px; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 15px; border-radius: 99px;
      border: 1px solid var(--glass-bd); background: var(--glass-bg); backdrop-filter: blur(8px);
      cursor: pointer; font-size: 0.84rem; font-weight: 500; color: var(--text-1);
      width: fit-content; transition: background 0.2s, transform 0.15s;
    }
    .back-btn:hover { transform: translateX(-3px); background: var(--glass-bd); }

    .player-frame { border-radius: 16px; overflow: hidden; }
    .vid-ph { position: relative; aspect-ratio: 16/9; overflow: hidden; }
    .vid-img { width: 100%; height: 100%; object-fit: cover; }
    .play-ov {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.14); cursor: pointer; transition: background 0.2s;
    }
    .play-ov:hover { background: rgba(0,0,0,0.26); }
    .play-big {
      width: 68px; height: 68px; border-radius: 50%;
      background: rgba(255,255,255,0.84); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; padding-left: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.22);
      transition: transform 0.2s;
    }
    .play-ov:hover .play-big { transform: scale(1.09); }

    .p-controls { padding: 11px 15px; border-top: 1px solid var(--glass-bd); border-radius: 0 0 16px 16px; }
    .progress {
      height: 4px; background: var(--glass-bd); border-radius: 2px;
      margin-bottom: 11px; overflow: hidden; cursor: pointer;
    }
    .progress-fill {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, var(--warm), var(--cool));
    }
    .ctrl-row { display: flex; align-items: center; justify-content: space-between; }
    .ctrl-grp { display: flex; align-items: center; gap: 6px; }
    .ctrl-btn {
      width: 32px; height: 32px; border: none; background: transparent; cursor: pointer;
      font-size: 15px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
      color: var(--text-1); transition: background 0.15s;
    }
    .ctrl-btn:hover { background: var(--glass-bg); }
    .time-lbl { font-size: 0.78rem; font-weight: 500; color: var(--text-2); }

    .p-info { display: flex; flex-direction: column; gap: 11px; }
    .p-title { font-size: 1.25rem; font-weight: 700; line-height: 1.35; }
    .p-meta { display: flex; gap: 7px; font-size: 0.83rem; color: var(--text-2); }
    .p-ch-row {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 15px; border-radius: 12px;
    }
    .p-ch-av { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--warm); }
    .p-ch-info { flex: 1; }
    .p-ch-name { font-weight: 600; font-size: 0.92rem; }
    .p-ch-subs { font-size: 0.78rem; color: var(--text-2); margin-top: 2px; }
    .sub-btn {
      padding: 7px 18px; border: none; border-radius: 99px;
      background: linear-gradient(135deg, var(--warm), var(--cool));
      color: #fff; font-weight: 600; font-size: 0.84rem; cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .sub-btn:hover { opacity: 0.88; transform: scale(1.03); }

    /* ── CAROUSEL ─────────────────────────────────────────── */
    .carousel-col { display: flex; flex-direction: column; gap: 10px; }
    .carousel-ttl { font-size: 0.98rem; font-weight: 700; padding: 0 4px; }

    .c-scene {
      position: relative; height: 750px;
      perspective: 880px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .c-drum {
      position: relative;
      width: 320px; height: 120px;
      transform-style: preserve-3d;
    }
    .c-item {
      position: absolute; inset: 0;
      border-radius: 12px; cursor: pointer;
    }
    .c-inner {
      display: flex; gap: 10px; align-items: center;
      padding: 10px; height: 100%;
      transition: transform 0.08s;
    }
    .c-thumb {
      width: 86px; height: 54px; border-radius: 7px;
      object-fit: cover; flex-shrink: 0;
    }
    .c-info { flex: 1; min-width: 0; }
    .c-title {
      font-size: 0.76rem; font-weight: 600; color: var(--text-1); line-height: 1.3;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      margin-bottom: 3px;
    }
    .c-meta { font-size: 0.68rem; color: var(--text-2); }
    .c-hint {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      font-size: 0.7rem; color: var(--text-3); white-space: nowrap; pointer-events: none;
      display: flex; align-items: center; gap: 4px;
    }

    /* ── SHADOW PANEL ─────────────────────────────────────── */
    .sh-panel { position: fixed; bottom: 22px; right: 22px; z-index: 200; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .sh-toggle {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 15px; border-radius: 99px;
      border: 1px solid var(--glass-bd); background: var(--glass-bg); backdrop-filter: blur(12px);
      cursor: pointer; font-size: 0.78rem; font-weight: 600; color: var(--text-1);
      box-shadow: var(--glass-sh); transition: transform 0.2s;
    }
    .sh-toggle:hover { transform: scale(1.05); }
    .sh-box { border-radius: 16px; padding: 15px; width: 272px; }
    .sh-tabs { display: flex; gap: 4px; margin-bottom: 13px; }
    .sh-tab {
      flex: 1; padding: 7px 4px; border: 1px solid var(--glass-bd); border-radius: 8px;
      background: transparent; cursor: pointer; font-size: 0.7rem; font-weight: 500; color: var(--text-2);
      transition: all 0.2s;
    }
    .sh-tab.on { background: linear-gradient(135deg, var(--warm-glow), var(--cool-glow)); border-color: var(--warm); color: var(--text-1); }
    .sh-row-label { font-size: 0.72rem; font-weight: 600; color: var(--text-2); margin-bottom: 10px; }
    .sh-ctrls { display: flex; flex-direction: column; gap: 9px; }
    .sh-field { display: flex; flex-direction: column; gap: 4px; }
    .sh-lbl-row { display: flex; justify-content: space-between; font-size: 0.71rem; color: var(--text-2); }
    .sh-val { color: var(--warm); font-weight: 600; }
    .sh-range { width: 100%; accent-color: var(--cool); }
    .sh-color-wrap { display: flex; align-items: center; gap: 8px; }
    .sh-color {
      width: 34px; height: 26px; border-radius: 6px; border: 1px solid var(--glass-bd);
      cursor: pointer; padding: 2px; background: none;
    }
    .sh-preview { margin-top: 12px; padding: 8px; border-radius: 10px; border: 1px solid var(--glass-bd); background: var(--glass-bg); }
    .sh-preview-lbl { font-size: 0.68rem; color: var(--text-3); margin-bottom: 6px; text-align: center; }
    .sh-preview-btn {
      width: 100%; padding: 8px; border-radius: 8px;
      border: 1px solid var(--glass-bd); background: var(--glass-bg);
      font-size: 0.8rem; font-weight: 500; color: var(--text-1); text-align: center;
    }

    /* ── SCROLLBAR ────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--glass-bd); border-radius: 3px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

/* ── DATA ──────────────────────────────────────────────────── */
const VIDEOS = [
  { id:1,  title:"Aurora Borealis in Iceland",       channel:"NatureScapes",  views:"4.2M",  age:"2 days ago",   dur:"8:42",  seed:10,  av:201 },
  { id:2,  title:"Deep Sea Exploration 4K",          channel:"OceanDepths",   views:"1.8M",  age:"5 days ago",   dur:"15:20", seed:20,  av:202 },
  { id:3,  title:"Neural Networks Explained",        channel:"TechMind",      views:"3.1M",  age:"1 week ago",   dur:"22:14", seed:30,  av:203 },
  { id:4,  title:"ISS: Life in Zero Gravity",        channel:"SpaceStation",  views:"6.7M",  age:"3 days ago",   dur:"18:55", seed:42,  av:204 },
  { id:5,  title:"Amazon Rainforest at Dawn",        channel:"WildEarth",     views:"2.3M",  age:"4 days ago",   dur:"11:08", seed:50,  av:205 },
  { id:6,  title:"Quantum Computing Basics",         channel:"TechMind",      views:"987K",  age:"2 weeks ago",  dur:"28:33", seed:63,  av:206 },
  { id:7,  title:"Mars Rover Terrain Footage",       channel:"SpaceStation",  views:"8.9M",  age:"6 days ago",   dur:"14:22", seed:70,  av:207 },

/* ── HELPERS ───────────────────────────────────────────────── */
function buildShadow({ color, blur, spread, opacity, y }) {
  const r = parseInt(color.slice(1,3),16);
  const g = parseInt(color.slice(3,5),16);
  const b = parseInt(color.slice(5,7),16);
  return `0 ${y}px ${blur}px ${spread}px rgba(${r},${g},${b},${opacity/100})`;
}

/* vertical 3D drum carousel */
function SuggestedCarousel({ videos, onVideoClick }) {
  const STEP   = 360 / videos.length;
  const RADIUS = 220;

  const [angle, setAngle]         = useState(0);
  const [dragging, setDragging]   = useState(false);
  const dragRef  = useRef(null);
  const sceneRef = useRef(null);

  /* mouse / touch drag */
  useEffect(() => {
    const onMove = (clientY) => {
      if (!dragRef.current) return;
      const delta = (clientY - dragRef.current.startY) * 0.34;
      setAngle(dragRef.current.startAngle + delta);
    };
    const onUp = () => { dragRef.current = null; setDragging(false); };

    const mm = (e) => onMove(e.clientY);
    const tm = (e) => { e.preventDefault(); onMove(e.touches[0].clientY); };

    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup',   onUp);
    window.addEventListener('touchmove', tm,  { passive: false });
    window.addEventListener('touchend',  onUp);
    return () => {
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('mouseup',   onUp);
      window.removeEventListener('touchmove', tm);
      window.removeEventListener('touchend',  onUp);
    };
  }, []);

  /* wheel — must be non-passive */
  useEffect(() => {
    const el = sceneRef.current;
    if (!el) return;
    const onWheel = (e) => { e.preventDefault(); setAngle(a => a + e.deltaY * 0.24); };
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, []);

  const onMouseDown = (e) => {
    dragRef.current = { startY: e.clientY, startAngle: angle };
    setDragging(true);
    e.preventDefault();
  };
  const onTouchStart = (e) => {
    dragRef.current = { startY: e.touches[0].clientY, startAngle: angle };
    setDragging(true);
  };

  return (
    <div className="carousel-col">
      <h3 className="carousel-ttl">Up Next</h3>
      <div
        ref={sceneRef}
        className="c-scene"
        onMouseDown={onMouseDown}
        onTouchStart={onTouchStart}
        style={{ cursor: dragging ? 'grabbing' : 'grab' }}
      >
        <div className="c-drum" style={{ transform: `rotateX(${angle}deg)` }}>
          {videos.map((v, i) => {
            const itemAngle  = -i * STEP;
            const total      = ((angle - i * STEP) % 360 + 360) % 360;
            const norm       = total > 180 ? total - 360 : total;
            const vis        = Math.cos(norm * Math.PI / 180);
            const opacity    = Math.max(0.07, vis);
            const scale      = 0.64 + 0.36 * Math.max(0, vis);
            return (
              <div
                key={v.id}
                className="c-item g"
                style={{
                  transform:     `rotateX(${itemAngle}deg) translateZ(${RADIUS}px)`,
                  opacity,
                  pointerEvents: vis < 0.35 ? 'none' : 'auto',
                }}
                onClick={() => onVideoClick(v)}
              >
                <div className="c-inner" style={{ transform: `scale(${scale})` }}>
                  <img className="c-thumb" src={`https://picsum.photos/seed/${v.seed}/200/112`} alt={v.title} loading="lazy" />
                  <div className="c-info">
                    <div className="c-title">{v.title}</div>
                    <div className="c-meta">{v.channel} · {v.dur} · {v.views}</div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        <div className="c-hint">↕ drag or scroll to browse</div>
      </div>
    </div>
  );
}

                {item.icon}
              </button>
            ))}
          </div>
          <div className="sh-row-label">{NAV_ITEMS[tab].label} shadow</div>
          <div className="sh-ctrls">
            <div className="sh-field">
              <div className="sh-lbl-row"><span>Color</span></div>
              <div className="sh-color-wrap">

              </div>
            </div>
            {[
              { k:'blur',    label:'Blur',     min:0,   max:50,  unit:'px' },
              { k:'spread',  label:'Spread',   min:0,   max:20,  unit:'px' },
              { k:'opacity', label:'Opacity',  min:0,   max:100, unit:'%'  },
              { k:'y',       label:'Y offset', min:-20, max:20,  unit:'px' },
            ].map(c => (
              <div key={c.k} className="sh-field">
                <div className="sh-lbl-row">
                  <span>{c.label}</span>
                  <span className="sh-val">{s[c.k]}{c.unit}</span>
                </div>
                <input type="range" className="sh-range" min={c.min} max={c.max} value={s[c.k]}
                  onChange={e => onChange(tab, c.k, +e.target.value)} />
              </div>
            ))}
          </div>
          <div className="sh-preview">
            <div className="sh-preview-lbl">live preview</div>
            <div className="sh-preview-btn" style={{boxShadow: buildShadow(s)}}>
              {NAV_ITEMS[tab].icon} {NAV_ITEMS[tab].label}
            </div>
          </div>
        </div>
      )}
      <button className="sh-toggle g" onClick={() => setOpen(o => !o)}>
        ⚙️ {open ? 'Close' : 'Button Shadows'}
      </button>
    </div>
  );
}

/* ── APP ───────────────────────────────────────────────────── */
function App() {
  const [theme,   setTheme]   = useState('light');
  const [sidebar, setSidebar] = useState(false);
  const [section, setSection] = useState('home');
  const [page,    setPage]    = useState('home');
  const [video,   setVideo]   = useState(null);
  const [shadows, setShadows] = useState(DEFAULT_SHADOWS);

  const toggleTheme = () => {
    const next = theme === 'light' ? 'dark' : 'light';
    setTheme(next);
    document.documentElement.setAttribute('data-theme', next);
  };

  const onShadow = (i, k, v) =>
    setShadows(prev => prev.map((s, idx) => idx === i ? { ...s, [k]: v } : s));

  const goVideo = (v) => {
    setVideo(v); setPage('player'); setSidebar(false);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const goHome = () => { setPage('home'); setVideo(null); };

  return (
    <>
      {/* decorative background orbs */}
      <div className="bg-orbs" aria-hidden="true">
        <div className="orb orb-1" /><div className="orb orb-2" /><div className="orb orb-3" /><div className="orb orb-4" /><div className="orb orb-5" />
      </div>

      <Navbar
        theme={theme} onToggle={toggleTheme}
        sidebarOpen={sidebar} onBurger={() => setSidebar(o => !o)}
      />

      <Sidebar
        isOpen={sidebar} section={section} shadows={shadows}
        onNav={s => { setSection(s); setSidebar(false); if (s === 'home') goHome(); }}
      />
      {sidebar && <div className="overlay" onClick={() => setSidebar(false)} />}

      <main className="main">
        {page === 'home'
          ? <Home videos={VIDEOS} onVideoClick={goVideo} />
          : video && <Player video={video} onBack={goHome} onVideoClick={goVideo} />
        }
      </main>

      <ShadowPanel shadows={shadows} onChange={onShadow} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
