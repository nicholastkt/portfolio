<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splash Cursor — Sandbox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; overflow: hidden; }
    canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }
    #hint {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.25); font-size: 12px; letter-spacing: 0.06em;
      font-family: system-ui, sans-serif; pointer-events: none; white-space: nowrap;
    }

    /* ── UI PANEL ── */
    #panel {
      position: fixed; top: 50%; right: 0; transform: translateY(-50%);
      z-index: 100; display: flex; align-items: flex-start;
      font-family: system-ui, sans-serif;
    }
    #panel-toggle {
      background: rgba(15,5,30,0.85); border: 1px solid rgba(255,255,255,0.1);
      border-right: none; color: rgba(255,255,255,0.55);
      width: 32px; height: 48px; cursor: pointer;
      border-radius: 8px 0 0 8px; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.2s, color 0.2s;
    }
    #panel-toggle:hover { background: rgba(40,10,80,0.9); color: #fff; }
    #panel-body {
      background: rgba(10,5,20,0.88); backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.08); border-right: none;
      border-radius: 12px 0 0 12px; padding: 16px; width: 220px;
      max-height: 90vh; overflow-y: auto;
      transition: width 0.25s ease, opacity 0.25s ease, padding 0.25s ease;
    }
    #panel.collapsed #panel-body { width: 0; padding: 0; opacity: 0; overflow: hidden; }
    .panel-title {
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.3); margin-bottom: 14px;
    }
    .ctrl-sep { height: 1px; background: rgba(255,255,255,0.07); margin: 12px 0; }
    .ctrl-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; color: rgba(255,255,255,0.65); font-size: 12px;
    }
    .ctrl-slider { margin-bottom: 12px; }
    .ctrl-slider > label {
      display: flex; justify-content: space-between;
      font-size: 11px; color: rgba(255,255,255,0.45); margin-bottom: 4px;
    }
    .ctrl-slider > label span { color: rgba(255,255,255,0.85); font-variant-numeric: tabular-nums; }
    .ctrl-slider input[type=range] { width: 100%; accent-color: #9b59f5; cursor: pointer; }
    .ctrl-label { font-size: 11px; color: rgba(255,255,255,0.45); margin-bottom: 6px; display: block; }
    input[type=color] {
      width: 100%; height: 30px; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px; cursor: pointer; background: none; padding: 2px;
    }
    @media (max-width: 768px) {
      #panel { display: none; }
    }

    /* Toggle switch */
    .sw-wrap { position: relative; display: inline-block; cursor: pointer; flex-shrink: 0; }
    .sw-wrap input { opacity: 0; width: 0; height: 0; position: absolute; }
    .sw-track {
      display: block; width: 36px; height: 20px; background: #333;
      border-radius: 10px; padding: 2px; transition: background 0.2s;
    }
    .sw-thumb {
      display: block; width: 16px; height: 16px; background: #666;
      border-radius: 50%; transition: transform 0.2s, background 0.2s;
    }
    .sw-wrap input:checked + .sw-track { background: #7c3aed; }
    .sw-wrap input:checked + .sw-track .sw-thumb { transform: translateX(16px); background: #fff; }
  </style>
</head>
<body>
  <canvas id="fluid"></canvas>
  <p id="hint">Move or click · touch to paint</p>

  <!-- UI PANEL -->
  <div id="panel">
    <button id="panel-toggle" title="Toggle controls">⚙</button>
    <div id="panel-body">
      <div class="panel-title">Fluid Controls</div>

      <!-- Toggles -->
      <div class="ctrl-row">
        <span>Rainbow Mode</span>
        <label class="sw-wrap"><input type="checkbox" id="ctrl-rainbow"><span class="sw-track"><span class="sw-thumb"></span></span></label>
      </div>
      <div class="ctrl-row">
        <span>Paused</span>
        <label class="sw-wrap"><input type="checkbox" id="ctrl-paused"><span class="sw-track"><span class="sw-thumb"></span></span></label>
      </div>
      <div class="ctrl-row">
        <span>Shading</span>
        <label class="sw-wrap"><input type="checkbox" id="ctrl-shading" checked><span class="sw-track"><span class="sw-thumb"></span></span></label>
      </div>

      <!-- Color (shown when rainbow off) -->
      <div class="ctrl-sep"></div>

      <!-- Color pickers -->
      <div style="margin-bottom:10px;">
        <span class="ctrl-label">Background Color</span>
        <input type="color" id="ctrl-bg" value="#ffffff">
      </div>
      <div id="color-group" style="margin-bottom:4px; opacity:1; pointer-events:auto; transition:opacity 0.2s;">
        <span class="ctrl-label">Splash Color <em style="font-size:10px; color:rgba(255,255,255,0.3); font-style:normal;">— rainbow off</em></span>
        <input type="color" id="ctrl-color" value="#ffffff">
      </div>

      <div class="ctrl-sep"></div>

      <!-- Sliders -->
      <div class="ctrl-slider">
        <label>Density Dissipation <span id="val-density">1.0</span></label>
        <input type="range" id="ctrl-density" min="0.5" max="10" step="0.1" value="1.0">
      </div>
      <div class="ctrl-slider">
        <label>Velocity Dissipation <span id="val-velocity">2</span></label>
        <input type="range" id="ctrl-velocity" min="0.1" max="5" step="0.1" value="2">
      </div>
      <div class="ctrl-slider">
        <label>Pressure <span id="val-pressure">0.1</span></label>
        <input type="range" id="ctrl-pressure" min="0" max="1" step="0.05" value="0.1">
      </div>
      <div class="ctrl-slider">
        <label>Curl (Turbulence) <span id="val-curl">3</span></label>
        <input type="range" id="ctrl-curl" min="0" max="50" step="1" value="3">
      </div>
      <div class="ctrl-slider">
        <label>Splat Radius <span id="val-radius">0.20</span></label>
        <input type="range" id="ctrl-radius" min="0.05" max="1" step="0.01" value="0.2">
      </div>
      <div class="ctrl-slider">
        <label>Splat Force <span id="val-force">2700</span></label>
        <input type="range" id="ctrl-force" min="500" max="12000" step="100" value="2700">
      </div>
      <div class="ctrl-slider">
        <label>Color Speed <span id="val-colorspeed">10</span></label>
        <input type="range" id="ctrl-colorspeed" min="1" max="30" step="1" value="10">
      </div>
    </div>
  </div>

  <script>
    // ─── CONFIG ───────────────────────────────────────────────────────────────
    // Tweak these to experiment with the fluid simulation
    const config = {
      SIM_RESOLUTION:      128,
      DYE_RESOLUTION:      1440,
      DENSITY_DISSIPATION: 1.0,
      VELOCITY_DISSIPATION: 0.4,
      PRESSURE:            0.2,
      PRESSURE_ITERATIONS: 20,
      CURL:                3,
      SPLAT_RADIUS:        0.2,
      SPLAT_FORCE:         2700,
      SHADING:             true,
      COLOR_UPDATE_SPEED:  6,
      RAINBOW_MODE:        false,   // false = use COLOR below
      COLOR:               '#000000',
      TRANSPARENT:         false,
      BACK_COLOR:          { r: 1, g: 1, b: 1 },
      PAUSED:              false,
    };
    // ─────────────────────────────────────────────────────────────────────────

    const canvas = document.getElementById('fluid');

    function pointerPrototype() {
      this.id = -1;
      this.texcoordX = 0; this.texcoordY = 0;
      this.prevTexcoordX = 0; this.prevTexcoordY = 0;
      this.deltaX = 0; this.deltaY = 0;
      this.down = false; this.moved = false;
      this.color = [0, 0, 0];
    }
    let pointers = [new pointerPrototype()];

    // ─── WEBGL SETUP ─────────────────────────────────────────────────────────
    const { gl, ext } = getWebGLContext(canvas);
    if (!ext.supportLinearFiltering) {
      config.DYE_RESOLUTION = 256;
      config.SHADING = false;
    }

    function getWebGLContext(canvas) {
      const params = { alpha: true, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };
      let gl = canvas.getContext('webgl2', params);
      const isWebGL2 = !!gl;
      if (!isWebGL2) gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
      let halfFloat, supportLinearFiltering;
      if (isWebGL2) {
        gl.getExtension('EXT_color_buffer_float');
        supportLinearFiltering = gl.getExtension('OES_texture_float_linear');
      } else {
        halfFloat = gl.getExtension('OES_texture_half_float');
        supportLinearFiltering = gl.getExtension('OES_texture_half_float_linear');
      }
      gl.clearColor(0, 0, 0, 1);
      const halfFloatTexType = isWebGL2 ? gl.HALF_FLOAT : halfFloat && halfFloat.HALF_FLOAT_OES;
      let formatRGBA, formatRG, formatR;
      if (isWebGL2) {
        formatRGBA = getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, halfFloatTexType);
        formatRG   = getSupportedFormat(gl, gl.RG16F,   gl.RG,   halfFloatTexType);
        formatR    = getSupportedFormat(gl, gl.R16F,    gl.RED,  halfFloatTexType);
      } else {
        formatRGBA = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
        formatRG   = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
        formatR    = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
      }
      return { gl, ext: { formatRGBA, formatRG, formatR, halfFloatTexType, supportLinearFiltering } };
    }

    function getSupportedFormat(gl, internalFormat, format, type) {
      if (!supportRenderTextureFormat(gl, internalFormat, format, type)) {
        switch (internalFormat) {
          case gl.R16F:  return getSupportedFormat(gl, gl.RG16F,   gl.RG,   type);
          case gl.RG16F: return getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, type);
          default: return null;
        }
      }
      return { internalFormat, format };
    }

    function supportRenderTextureFormat(gl, internalFormat, format, type) {
      const texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
      const fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
      return gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    }

    // ─── SHADER PROGRAMS ─────────────────────────────────────────────────────
    class Material {
      constructor(vertexShader, fragmentShaderSource) {
        this.vertexShader = vertexShader;
        this.fragmentShaderSource = fragmentShaderSource;
        this.programs = []; this.activeProgram = null; this.uniforms = [];
      }
      setKeywords(keywords) {
        let hash = 0;
        for (let i = 0; i < keywords.length; i++) hash += hashCode(keywords[i]);
        let program = this.programs[hash];
        if (program == null) {
          program = createProgram(this.vertexShader, compileShader(gl.FRAGMENT_SHADER, this.fragmentShaderSource, keywords));
          this.programs[hash] = program;
        }
        if (program === this.activeProgram) return;
        this.uniforms = getUniforms(program);
        this.activeProgram = program;
      }
      bind() { gl.useProgram(this.activeProgram); }
    }

    class Program {
      constructor(vertexShader, fragmentShader) {
        this.program = createProgram(vertexShader, fragmentShader);
        this.uniforms = getUniforms(this.program);
      }
      bind() { gl.useProgram(this.program); }
    }

    function createProgram(vs, fs) {
      const p = gl.createProgram();
      gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
      return p;
    }

    function getUniforms(program) {
      const uniforms = [];
      const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < count; i++) {
        const name = gl.getActiveUniform(program, i).name;
        uniforms[name] = gl.getUniformLocation(program, name);
      }
      return uniforms;
    }

    function compileShader(type, source, keywords) {
      if (keywords) source = keywords.map(k => '#define ' + k).join('\n') + '\n' + source;
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source); gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(shader));
      return shader;
    }

    const baseVertexShader = compileShader(gl.VERTEX_SHADER, `
      precision highp float;
      attribute vec2 aPosition;
      varying vec2 vUv, vL, vR, vT, vB;
      uniform vec2 texelSize;
      void main () {
        vUv = aPosition * 0.5 + 0.5;
        vL = vUv - vec2(texelSize.x, 0.0); vR = vUv + vec2(texelSize.x, 0.0);
        vT = vUv + vec2(0.0, texelSize.y); vB = vUv - vec2(0.0, texelSize.y);
        gl_Position = vec4(aPosition, 0.0, 1.0);
      }`);

    const copyShader       = compileShader(gl.FRAGMENT_SHADER, `precision mediump float; precision mediump sampler2D; varying highp vec2 vUv; uniform sampler2D uTexture; void main () { gl_FragColor = texture2D(uTexture, vUv); }`);
    const clearShader      = compileShader(gl.FRAGMENT_SHADER, `precision mediump float; precision mediump sampler2D; varying highp vec2 vUv; uniform sampler2D uTexture; uniform float value; void main () { gl_FragColor = value * texture2D(uTexture, vUv); }`);
    const divergenceShader = compileShader(gl.FRAGMENT_SHADER, `precision mediump float; precision mediump sampler2D; varying highp vec2 vUv,vL,vR,vT,vB; uniform sampler2D uVelocity; void main () { float L=texture2D(uVelocity,vL).x,R=texture2D(uVelocity,vR).x,T=texture2D(uVelocity,vT).y,B=texture2D(uVelocity,vB).y; vec2 C=texture2D(uVelocity,vUv).xy; if(vL.x<0.0){L=-C.x;} if(vR.x>1.0){R=-C.x;} if(vT.y>1.0){T=-C.y;} if(vB.y<0.0){B=-C.y;} gl_FragColor=vec4(0.5*(R-L+T-B),0,0,1); }`);
    const curlShader       = compileShader(gl.FRAGMENT_SHADER, `precision mediump float; precision mediump sampler2D; varying highp vec2 vUv,vL,vR,vT,vB; uniform sampler2D uVelocity; void main () { float L=texture2D(uVelocity,vL).y,R=texture2D(uVelocity,vR).y,T=texture2D(uVelocity,vT).x,B=texture2D(uVelocity,vB).x; gl_FragColor=vec4(0.5*(R-L-T+B),0,0,1); }`);
    const pressureShader   = compileShader(gl.FRAGMENT_SHADER, `precision mediump float; precision mediump sampler2D; varying highp vec2 vUv,vL,vR,vT,vB; uniform sampler2D uPressure,uDivergence; void main () { float L=texture2D(uPressure,vL).x,R=texture2D(uPressure,vR).x,T=texture2D(uPressure,vT).x,B=texture2D(uPressure,vB).x,divergence=texture2D(uDivergence,vUv).x; gl_FragColor=vec4((L+R+B+T-divergence)*0.25,0,0,1); }`);
    const gradSubShader    = compileShader(gl.FRAGMENT_SHADER, `precision mediump float; precision mediump sampler2D; varying highp vec2 vUv,vL,vR,vT,vB; uniform sampler2D uPressure,uVelocity; void main () { float L=texture2D(uPressure,vL).x,R=texture2D(uPressure,vR).x,T=texture2D(uPressure,vT).x,B=texture2D(uPressure,vB).x; vec2 velocity=texture2D(uVelocity,vUv).xy; velocity.xy-=vec2(R-L,T-B); gl_FragColor=vec4(velocity,0,1); }`);

    const splatShader = compileShader(gl.FRAGMENT_SHADER, `
      precision highp float; precision highp sampler2D;
      varying vec2 vUv; uniform sampler2D uTarget;
      uniform float aspectRatio; uniform vec3 color; uniform vec2 point; uniform float radius;
      void main () {
        vec2 p = vUv - point.xy; p.x *= aspectRatio;
        vec3 splat = exp(-dot(p,p)/radius) * color;
        gl_FragColor = vec4(texture2D(uTarget,vUv).xyz + splat, 1.0);
      }`);

    const vorticityShader = compileShader(gl.FRAGMENT_SHADER, `
      precision highp float; precision highp sampler2D;
      varying vec2 vUv,vL,vR,vT,vB; uniform sampler2D uVelocity,uCurl;
      uniform float curl,dt;
      void main () {
        float L=texture2D(uCurl,vL).x,R=texture2D(uCurl,vR).x,T=texture2D(uCurl,vT).x,B=texture2D(uCurl,vB).x,C=texture2D(uCurl,vUv).x;
        vec2 force=0.5*vec2(abs(T)-abs(B),abs(R)-abs(L));
        force/=length(force)+0.0001; force*=curl*C; force.y*=-1.0;
        vec2 vel=texture2D(uVelocity,vUv).xy+force*dt;
        vel=min(max(vel,-1000.0),1000.0);
        gl_FragColor=vec4(vel,0,1);
      }`);

    const advectionShader = compileShader(gl.FRAGMENT_SHADER, `
      precision highp float; precision highp sampler2D;
      varying vec2 vUv; uniform sampler2D uVelocity,uSource;
      uniform vec2 texelSize,dyeTexelSize; uniform float dt,dissipation;
      vec4 bilerp(sampler2D sam,vec2 uv,vec2 tsize){
        vec2 st=uv/tsize-0.5,iuv=floor(st),fuv=fract(st);
        vec4 a=texture2D(sam,(iuv+vec2(.5,.5))*tsize),b=texture2D(sam,(iuv+vec2(1.5,.5))*tsize),
             c=texture2D(sam,(iuv+vec2(.5,1.5))*tsize),d=texture2D(sam,(iuv+vec2(1.5,1.5))*tsize);
        return mix(mix(a,b,fuv.x),mix(c,d,fuv.x),fuv.y);
      }
      void main(){
        #ifdef MANUAL_FILTERING
          vec2 coord=vUv-dt*bilerp(uVelocity,vUv,texelSize).xy*texelSize;
          vec4 result=bilerp(uSource,coord,dyeTexelSize);
        #else
          vec2 coord=vUv-dt*texture2D(uVelocity,vUv).xy*texelSize;
          vec4 result=texture2D(uSource,coord);
        #endif
        gl_FragColor=result/(1.0+dissipation*dt);
      }`, ext.supportLinearFiltering ? null : ['MANUAL_FILTERING']);

    const displayShaderSource = `
      precision highp float; precision highp sampler2D;
      varying vec2 vUv,vL,vR,vT,vB; uniform sampler2D uTexture;
      uniform vec2 texelSize;
      uniform vec3 uBackColor;
      void main(){
        vec3 c=texture2D(uTexture,vUv).rgb;
        #ifdef SHADING
          vec3 lc=texture2D(uTexture,vL).rgb,rc=texture2D(uTexture,vR).rgb,
               tc=texture2D(uTexture,vT).rgb,bc=texture2D(uTexture,vB).rgb;
          float dx=length(rc)-length(lc),dy=length(tc)-length(bc);
          vec3 n=normalize(vec3(dx,dy,length(texelSize)));
          c*=clamp(dot(n,vec3(0,0,1))+0.7,0.7,1.0);
        #endif
        float bgLuma=dot(uBackColor,vec3(0.299,0.587,0.114));
        float isLight=step(0.5,bgLuma);
        float a=max(c.r,max(c.g,c.b));
        vec3 additive=c+uBackColor*(1.0-a);
        vec3 subtractive=clamp(uBackColor-c*2.0,0.0,1.0);
        gl_FragColor=vec4(mix(additive,subtractive,isLight),1.0);
      }`;

    // ─── BLIT + FBOS ─────────────────────────────────────────────────────────
    const blit = (() => {
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,-1,1,1,1,1,-1]), gl.STATIC_DRAW);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0,1,2,0,2,3]), gl.STATIC_DRAW);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      gl.enableVertexAttribArray(0);
      return (target, clear = false) => {
        if (target == null) { gl.viewport(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight); gl.bindFramebuffer(gl.FRAMEBUFFER,null); }
        else { gl.viewport(0,0,target.width,target.height); gl.bindFramebuffer(gl.FRAMEBUFFER,target.fbo); }
        if (clear) { gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); }
        gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
      };
    })();

    function createFBO(w, h, internalFormat, format, type, param) {
      gl.activeTexture(gl.TEXTURE0);
      const texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);
      const fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
      gl.viewport(0,0,w,h); gl.clear(gl.COLOR_BUFFER_BIT);
      return { texture, fbo, width:w, height:h, texelSizeX:1/w, texelSizeY:1/h,
        attach(id){ gl.activeTexture(gl.TEXTURE0+id); gl.bindTexture(gl.TEXTURE_2D,texture); return id; } };
    }

    function createDoubleFBO(w,h,internalFormat,format,type,param){
      let fbo1=createFBO(w,h,internalFormat,format,type,param);
      let fbo2=createFBO(w,h,internalFormat,format,type,param);
      return { width:w, height:h, texelSizeX:fbo1.texelSizeX, texelSizeY:fbo1.texelSizeY,
        get read(){return fbo1;}, set read(v){fbo1=v;},
        get write(){return fbo2;}, set write(v){fbo2=v;},
        swap(){ let t=fbo1; fbo1=fbo2; fbo2=t; } };
    }

    function resizeFBO(target,w,h,internalFormat,format,type,param){
      const n=createFBO(w,h,internalFormat,format,type,param);
      copyProgram.bind(); gl.uniform1i(copyProgram.uniforms.uTexture,target.attach(0)); blit(n); return n;
    }

    function resizeDoubleFBO(target,w,h,internalFormat,format,type,param){
      if(target.width===w&&target.height===h) return target;
      target.read=resizeFBO(target.read,w,h,internalFormat,format,type,param);
      target.write=createFBO(w,h,internalFormat,format,type,param);
      target.width=w; target.height=h; target.texelSizeX=1/w; target.texelSizeY=1/h;
      return target;
    }

    // ─── PROGRAMS ────────────────────────────────────────────────────────────
    const copyProgram        = new Program(baseVertexShader, copyShader);
    const clearProgram       = new Program(baseVertexShader, clearShader);
    const splatProgram       = new Program(baseVertexShader, splatShader);
    const advectionProgram   = new Program(baseVertexShader, advectionShader);
    const divergenceProgram  = new Program(baseVertexShader, divergenceShader);
    const curlProgram        = new Program(baseVertexShader, curlShader);
    const vorticityProgram   = new Program(baseVertexShader, vorticityShader);
    const pressureProgram    = new Program(baseVertexShader, pressureShader);
    const gradSubProgram     = new Program(baseVertexShader, gradSubShader);
    const displayMaterial    = new Material(baseVertexShader, displayShaderSource);

    // ─── FRAMEBUFFERS ────────────────────────────────────────────────────────
    let dye, velocity, divergence, curl, pressure;

    function initFramebuffers() {
      const simRes = getResolution(config.SIM_RESOLUTION);
      const dyeRes = getResolution(config.DYE_RESOLUTION);
      const texType = ext.halfFloatTexType, rgba = ext.formatRGBA, rg = ext.formatRG, r = ext.formatR;
      const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;
      gl.disable(gl.BLEND);
      dye      = dye      ? resizeDoubleFBO(dye,      dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering)
                          : createDoubleFBO(dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);
      velocity = velocity ? resizeDoubleFBO(velocity, simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering)
                          : createDoubleFBO(simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering);
      divergence = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
      curl       = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
      pressure   = createDoubleFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
    }

    // ─── SIMULATION ──────────────────────────────────────────────────────────
    function updateKeywords() {
      const kw = [];
      if (config.SHADING) kw.push('SHADING');
      displayMaterial.setKeywords(kw);
    }

    function step(dt) {
      gl.disable(gl.BLEND);
      curlProgram.bind();
      gl.uniform2f(curlProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
      gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
      blit(curl);

      vorticityProgram.bind();
      gl.uniform2f(vorticityProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
      gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
      gl.uniform1i(vorticityProgram.uniforms.uCurl, curl.attach(1));
      gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
      gl.uniform1f(vorticityProgram.uniforms.dt, dt);
      blit(velocity.write); velocity.swap();

      divergenceProgram.bind();
      gl.uniform2f(divergenceProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
      gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
      blit(divergence);

      clearProgram.bind();
      gl.uniform1i(clearProgram.uniforms.uTexture, pressure.read.attach(0));
      gl.uniform1f(clearProgram.uniforms.value, config.PRESSURE);
      blit(pressure.write); pressure.swap();

      pressureProgram.bind();
      gl.uniform2f(pressureProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
      gl.uniform1i(pressureProgram.uniforms.uDivergence, divergence.attach(0));
      for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
        gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(1));
        blit(pressure.write); pressure.swap();
      }

      gradSubProgram.bind();
      gl.uniform2f(gradSubProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
      gl.uniform1i(gradSubProgram.uniforms.uPressure, pressure.read.attach(0));
      gl.uniform1i(gradSubProgram.uniforms.uVelocity, velocity.read.attach(1));
      blit(velocity.write); velocity.swap();

      advectionProgram.bind();
      gl.uniform2f(advectionProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
      if (!ext.supportLinearFiltering)
        gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
      const velId = velocity.read.attach(0);
      gl.uniform1i(advectionProgram.uniforms.uVelocity, velId);
      gl.uniform1i(advectionProgram.uniforms.uSource, velId);
      gl.uniform1f(advectionProgram.uniforms.dt, dt);
      gl.uniform1f(advectionProgram.uniforms.dissipation, config.VELOCITY_DISSIPATION);
      blit(velocity.write); velocity.swap();

      if (!ext.supportLinearFiltering)
        gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
      gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
      gl.uniform1i(advectionProgram.uniforms.uSource, dye.read.attach(1));
      gl.uniform1f(advectionProgram.uniforms.dissipation, config.DENSITY_DISSIPATION);
      blit(dye.write); dye.swap();
    }

    function render(target) {
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.enable(gl.BLEND);
      const width  = target == null ? gl.drawingBufferWidth  : target.width;
      const height = target == null ? gl.drawingBufferHeight : target.height;
      displayMaterial.bind();
      if (config.SHADING) gl.uniform2f(displayMaterial.uniforms.texelSize, 1/width, 1/height);
      gl.uniform1i(displayMaterial.uniforms.uTexture, dye.read.attach(0));
      gl.uniform3f(displayMaterial.uniforms.uBackColor, config.BACK_COLOR.r, config.BACK_COLOR.g, config.BACK_COLOR.b);
      blit(target);
    }

    // ─── SPLATS ──────────────────────────────────────────────────────────────
    function splat(x, y, dx, dy, color) {
      splatProgram.bind();
      gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
      gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
      gl.uniform2f(splatProgram.uniforms.point, x, y);
      gl.uniform3f(splatProgram.uniforms.color, dx, dy, 0);
      gl.uniform1f(splatProgram.uniforms.radius, correctRadius(config.SPLAT_RADIUS / 100));
      blit(velocity.write); velocity.swap();
      gl.uniform1i(splatProgram.uniforms.uTarget, dye.read.attach(0));
      gl.uniform3f(splatProgram.uniforms.color, color.r, color.g, color.b);
      blit(dye.write); dye.swap();
    }

    function splatPointer(p) { splat(p.texcoordX, p.texcoordY, p.deltaX * config.SPLAT_FORCE, p.deltaY * config.SPLAT_FORCE, p.color); }

    function clickSplat(p) {
      const color = generateColor();
      color.r *= 10; color.g *= 10; color.b *= 10;
      splat(p.texcoordX, p.texcoordY, 10*(Math.random()-0.5), 30*(Math.random()-0.5), color);
    }

    function correctRadius(r) { const a = canvas.width/canvas.height; if (a>1) r*=a; return r; }
    function correctDeltaX(d) { const a = canvas.width/canvas.height; if (a<1) d*=a; return d; }
    function correctDeltaY(d) { const a = canvas.width/canvas.height; if (a>1) d/=a; return d; }

    // ─── POINTER DATA ────────────────────────────────────────────────────────
    function updatePointerDownData(pointer, id, posX, posY) {
      pointer.id=id; pointer.down=true; pointer.moved=false;
      pointer.texcoordX=posX/canvas.width; pointer.texcoordY=1-(posY/canvas.height);
      pointer.prevTexcoordX=pointer.texcoordX; pointer.prevTexcoordY=pointer.texcoordY;
      pointer.deltaX=0; pointer.deltaY=0; pointer.color=generateColor();
    }

    function updatePointerMoveData(pointer, posX, posY, color) {
      pointer.prevTexcoordX=pointer.texcoordX; pointer.prevTexcoordY=pointer.texcoordY;
      pointer.texcoordX=posX/canvas.width; pointer.texcoordY=1-(posY/canvas.height);
      pointer.deltaX=correctDeltaX(pointer.texcoordX-pointer.prevTexcoordX);
      pointer.deltaY=correctDeltaY(pointer.texcoordY-pointer.prevTexcoordY);
      pointer.moved=Math.abs(pointer.deltaX)>0||Math.abs(pointer.deltaY)>0;
      pointer.color=color;
    }

    function updatePointerUpData(pointer) { pointer.down=false; }

    // ─── COLOR ───────────────────────────────────────────────────────────────
    function hexToRGB(hex) {
      let v = hex.replace('#','');
      if (v.length===3) v=v[0]+v[0]+v[1]+v[1]+v[2]+v[2];
      const r=parseInt(v.slice(0,2),16)/255, g=parseInt(v.slice(2,4),16)/255, b=parseInt(v.slice(4,6),16)/255;
      const bgLuma=0.299*config.BACK_COLOR.r+0.587*config.BACK_COLOR.g+0.114*config.BACK_COLOR.b;
      if(bgLuma>0.5) return {r:(1-r)*0.5,g:(1-g)*0.5,b:(1-b)*0.5};
      return {r:r*0.15,g:g*0.15,b:b*0.15};
    }

    function generateColor() {
      if (!config.RAINBOW_MODE) return hexToRGB(config.COLOR);
      const c = HSVtoRGB(Math.random(), 1, 1);
      c.r*=0.15; c.g*=0.15; c.b*=0.15; return c;
    }

    function HSVtoRGB(h,s,v) {
      const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
      const cases=[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]];
      const [r,g,b]=cases[i%6]; return {r,g,b};
    }

    // ─── UTILS ───────────────────────────────────────────────────────────────
    function wrap(v,min,max){ const r=max-min; if(!r) return min; return ((v-min)%r)+min; }

    function getResolution(res) {
      let ar = gl.drawingBufferWidth/gl.drawingBufferHeight;
      if (ar<1) ar=1/ar;
      const min=Math.round(res), max=Math.round(res*ar);
      return gl.drawingBufferWidth>gl.drawingBufferHeight ? {width:max,height:min} : {width:min,height:max};
    }

    function scaleByPixelRatio(v) { return Math.floor(v*(window.devicePixelRatio||1)); }

    function hashCode(s) {
      let h=0;
      for (let i=0;i<s.length;i++) { h=(h<<5)-h+s.charCodeAt(i); h|=0; }
      return h;
    }

    // ─── MAIN LOOP ───────────────────────────────────────────────────────────
    updateKeywords();
    initFramebuffers();

    let lastUpdateTime = Date.now();
    let colorUpdateTimer = 0;

    function updateFrame() {
      const now = Date.now();
      let dt = Math.min((now - lastUpdateTime) / 1000, 0.016666);
      lastUpdateTime = now;

      if (resizeCanvas()) initFramebuffers();

      colorUpdateTimer += dt * config.COLOR_UPDATE_SPEED;
      if (colorUpdateTimer >= 1) {
        colorUpdateTimer = wrap(colorUpdateTimer, 0, 1);
        pointers.forEach(p => { p.color = generateColor(); });
      }

      pointers.forEach(p => { if (p.moved) { p.moved=false; splatPointer(p); } });

      if (!config.PAUSED) step(dt);
      render(null);
      requestAnimationFrame(updateFrame);
    }

    function resizeCanvas() {
      const w=scaleByPixelRatio(canvas.clientWidth), h=scaleByPixelRatio(canvas.clientHeight);
      if (canvas.width!==w||canvas.height!==h) { canvas.width=w; canvas.height=h; return true; }
      return false;
    }

    requestAnimationFrame(updateFrame);

    // ─── INPUT EVENTS ────────────────────────────────────────────────────────
    let firstMove = false;

    window.addEventListener('mousedown', e => {
      const p=pointers[0], x=scaleByPixelRatio(e.clientX), y=scaleByPixelRatio(e.clientY);
      updatePointerDownData(p,-1,x,y); clickSplat(p);
    });

    window.addEventListener('mousemove', e => {
      const p=pointers[0], x=scaleByPixelRatio(e.clientX), y=scaleByPixelRatio(e.clientY);
      const color = firstMove ? p.color : generateColor();
      updatePointerMoveData(p, x, y, color);
      firstMove = true;
    });

    window.addEventListener('touchstart', e => {
      e.preventDefault();
      for (let i = 0; i < e.targetTouches.length; i++) {
        const touch = e.targetTouches[i];
        let p = pointers.find(pt => pt.id === touch.identifier);
        if (!p) { p = new pointerPrototype(); pointers.push(p); }
        updatePointerDownData(p, touch.identifier, scaleByPixelRatio(touch.clientX), scaleByPixelRatio(touch.clientY));
        clickSplat(p);
      }
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      e.preventDefault();
      for (let i = 0; i < e.targetTouches.length; i++) {
        const touch = e.targetTouches[i];
        const p = pointers.find(pt => pt.id === touch.identifier);
        if (!p) continue;
        updatePointerMoveData(p, scaleByPixelRatio(touch.clientX), scaleByPixelRatio(touch.clientY), p.color);
      }
    }, { passive: false });

    window.addEventListener('touchend', e => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const p = pointers.find(pt => pt.id === touch.identifier);
        if (p) updatePointerUpData(p);
      }
    });

    // ─── UI PANEL WIRING ─────────────────────────────────────────────────────
    document.getElementById('panel-toggle').addEventListener('click', () => {
      document.getElementById('panel').classList.toggle('collapsed');
    });

    function bindSlider(inputId, valId, key, fmt) {
      const input = document.getElementById(inputId);
      const valEl = document.getElementById(valId);
      input.addEventListener('input', () => {
        const v = parseFloat(input.value);
        config[key] = v;
        valEl.textContent = fmt ? v.toFixed(fmt) : v;
      });
    }

    bindSlider('ctrl-density',    'val-density',    'DENSITY_DISSIPATION',  1);
    bindSlider('ctrl-velocity',   'val-velocity',   'VELOCITY_DISSIPATION', 1);
    bindSlider('ctrl-pressure',   'val-pressure',   'PRESSURE',             2);
    bindSlider('ctrl-curl',       'val-curl',       'CURL',                 0);
    bindSlider('ctrl-radius',     'val-radius',     'SPLAT_RADIUS',         2);
    bindSlider('ctrl-force',      'val-force',      'SPLAT_FORCE',          0);
    bindSlider('ctrl-colorspeed', 'val-colorspeed', 'COLOR_UPDATE_SPEED',   0);

    document.getElementById('ctrl-rainbow').addEventListener('change', e => {
      config.RAINBOW_MODE = e.target.checked;
      const cg = document.getElementById('color-group');
      cg.style.opacity = e.target.checked ? '0.35' : '1';
      cg.style.pointerEvents = e.target.checked ? 'none' : 'auto';
    });

    document.getElementById('ctrl-bg').addEventListener('input', e => {
      const hex = e.target.value;
      document.body.style.background = hex;
      config.BACK_COLOR = {
        r: parseInt(hex.slice(1,3),16)/255,
        g: parseInt(hex.slice(3,5),16)/255,
        b: parseInt(hex.slice(5,7),16)/255,
      };
    });

    document.getElementById('ctrl-paused').addEventListener('change', e => {
      config.PAUSED = e.target.checked;
    });

    document.getElementById('ctrl-shading').addEventListener('change', e => {
      config.SHADING = e.target.checked;
    });

    document.getElementById('ctrl-color').addEventListener('input', e => {
      config.COLOR = e.target.value;
    });
  </script>
</body>
</html>
